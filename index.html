<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#efebe3" />
    <meta name="description" content="WaffleCAD: touch-first parametric 3D CAD for tablets. Constrained sketches, extrusions, STEP export." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>WaffleCAD</title>
    <!-- The loading screen is styled here, so it shows before the app's own styles and code load.
         Same background and icon as the system splash of the installed app: one continues the other. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #16181d;
        color: #e9ebef;
        font-family: system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 112px;
        height: 112px;
      }
      .splash-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      /* What it waits for shows only if the wait lasts: a quick start shows just the waffle. */
      .splash-wait {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        animation: splash-in 0.3s ease 0.5s forwards;
      }
      .splash-bar {
        width: 160px;
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        background: #2c3038;
      }
      .splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #f0b956;
        animation: splash-run 1.1s ease-in-out infinite;
      }
      .splash-step {
        font-size: 13px;
        color: #9aa1ad;
        min-height: 1.3em;
        text-align: center;
        padding: 0 24px;
      }
      .splash-step.err {
        color: #ff8a80;
      }
      #splash button {
        display: none;
        padding: 10px 22px;
        border: none;
        border-radius: 12px;
        background: #f0b956;
        color: #16181d;
        font: inherit;
        font-weight: 700;
      }
      #splash.failed button {
        display: block;
      }
      #splash.failed .splash-bar {
        visibility: hidden;
      }
      @keyframes splash-in {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar span {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body data-mode="part">
    <div id="splash" role="status" aria-live="polite">
      <img src="./icon.svg" alt="" />
      <div class="splash-name">WaffleCAD</div>
      <div class="splash-wait">
        <div class="splash-bar"><span></span></div>
        <div class="splash-step">Loading…</div>
        <button type="button">Continue</button>
      </div>
    </div>
    <!-- The 3D view fills the window; every control floats above it. -->
    <main id="view"></main>
    <div id="build-bar" role="progressbar" aria-label="Building the model"></div>

    <aside id="tools" aria-label="Tools"></aside>

    <nav id="workspace" aria-label="Workspace"></nav>

    <div id="status-pill"><span class="dot"></span><span id="status"></span></div>

    <div id="nav">
      <div id="gizmo"></div>
      <div id="view-buttons"></div>
    </div>

    <aside id="panel" aria-live="polite"><div class="panel-grip" title="Drag to move"></div><div id="panel-content"></div></aside>

    <footer id="timeline">
      <div class="history">
        <button class="undo-btn" aria-label="Undo" title="Undo (Ctrl+Z, two-finger tap)"></button>
        <button class="redo-btn" aria-label="Redo" title="Redo (Ctrl+Y, three-finger tap)"></button>
      </div>
      <div id="chips"></div>
      <div class="menu-wrap">
        <button id="menu" aria-label="Menu"></button>
        <div id="menu-panel" class="menu"></div>
      </div>
    </footer>

    <div id="toast" role="status"></div>

    <div id="about" role="dialog" aria-modal="true" aria-labelledby="about-name">
      <div class="about-card">
        <img src="./icon.svg" alt="" class="about-icon" />
        <h2 id="about-name">WaffleCAD</h2>
        <div id="about-version" class="about-version"></div>
        <p>Parametric 3D CAD made for fingers and styluses, right in the browser. It works offline, and your projects stay on this device.</p>
        <div class="about-links">
          <a href="https://github.com/yighy/wafflecad" target="_blank" rel="noopener">Source code</a>
          <a href="https://github.com/yighy/wafflecad/releases" target="_blank" rel="noopener">What's new</a>
        </div>
        <p class="about-credits">Built on OpenCascade (through replicad), the FreeCAD sketch solver (planegcs) and three.js.</p>
        <button id="about-close" class="primary">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
